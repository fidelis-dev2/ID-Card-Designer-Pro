<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Video Guide - ID Studio</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="manual-page"><div class="manual-card"><h1><i class="fa-solid fa-circle-play"></i> Video Guide ya Kutumia ID Studio</h1><p>Bonyeza Play kuona maelekezo yanayocheza hatua kwa hatua ndani ya browser.</p><a class="btn btn-info" href="index.html"><i class="fa-solid fa-arrow-left"></i> Rudi kwenye Designer</a> <a class="btn btn-primary" href="manual.html"><i class="fa-solid fa-book"></i> Soma User Manual</a></div><div class="manual-card"><div class="video-stage"><div class="video-card"><i id="vIcon" class="fa-solid fa-id-card-clip"></i><h2 id="vTitle">Karibu ID Card Designer Pro</h2><p id="vText">Mfumo huu hukuwezesha kubuni kitambulisho upande wa mbele na nyuma.</p><div class="progress"><div id="bar"></div></div><div class="play-row"><button class="btn btn-warning" id="playBtn"><i class="fa-solid fa-play"></i> Play</button><button class="btn btn-light" id="pauseBtn"><i class="fa-solid fa-pause"></i> Pause</button><button class="btn btn-danger" id="restartBtn"><i class="fa-solid fa-rotate-left"></i> Restart</button></div></div></div></div></main><script>const steps=[['fa-id-card-clip','Karibu ID Card Designer Pro','Mfumo huu hukuwezesha kubuni kitambulisho upande wa mbele na nyuma.'],['fa-repeat','Geuza Mbele/Nyuma','Tumia button za Mbele na Nyuma kuchagua upande unaotaka kubuni.'],['fa-layer-group','Chagua Template','Chagua template tayari au Blank Card kuanza na ukurasa mtupu.'],['fa-font','Ongeza na Hariri Text','Ongeza text, heading, QR code, barcode, box, circle na line.'],['fa-camera','Tumia Camera','Fungua camera ya laptop au simu kupiga passport photo.'],['fa-sliders','Badili Appearance','Badili font, size, rangi, opacity na border kwenye paneli ya kulia.'],['fa-floppy-disk','Save na Load JSON','Save JSON hutunza design ya mbele na nyuma kwa matumizi ya baadaye.'],['fa-file-pdf','Export PNG/PDF','PNG hu-save upande uliopo; PDF huandaa mbele na nyuma kwa kuchapisha/download.']];let i=0,timer=null,playing=false;function show(){let s=steps[i];vIcon.className='fa-solid '+s[0];vTitle.textContent=s[1];vText.textContent=s[2];bar.style.width=((i+1)/steps.length*100)+'%';}function play(){if(playing)return;playing=true;timer=setInterval(()=>{i=(i+1)%steps.length;show();},3000);}function pause(){playing=false;clearInterval(timer)}playBtn.onclick=play;pauseBtn.onclick=pause;restartBtn.onclick=()=>{pause();i=0;show()};show();</script></body></html>
